org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

group_id=dev.vitrail
# WynnVitrail: a Wynncraft-adapted fork of Vitrail. The id is its own so the two never claim to be
# the same mod, and the version keeps the upstream number in front so a jar says which Vitrail it
# was forked from. `wynn1` counts our own revisions on top of it.
mod_id=wynnvitrail
mod_version=0.12.0-beta-wynn3
java_version=25

# The game this build is for. WynnVitrail follows the WynnIris tree this port came from, which is
# the 26.3 one, so 26.3 is what a plain `gradlew build` makes and what every reading in .workbuddy
# is measured against. The build can still be pointed at the other game with `-Pminecraft=26.2`,
# and nothing here promises that one compiles: this fork's Wynncraft code is written against 26.3's
# names where the shared tree around it is written against 26.2's, and a class naming a type only
# one game has belongs to that game alone.
minecraft=26.3

# Toolchain that does not follow the game. The Fabric loader is only ever compiled against, never
# remapped for: from 26.2 on there is one set of names.
fabric_loader_version=0.19.5
moddev_version=2.0.147

# The oldest Fabric Loader a player may run it on, and the metadata refuses anything below it. It is
# not the toolchain above, which only decides what the code is compiled against: a floor raised with
# it turns away every player whose loader still carries everything the code reaches.
fabric_loader_min_version=0.19.3

# Provided at runtime by whichever loader is in front, never bundled either. The Mixin version is
# the one Fabric Loader ships; NeoForge carries the same upstream 0.8.7 under its own coordinates.
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.4

# Static analysis. Only the checks it rates as errors fail the build; see build.gradle.
errorprone_version=2.50.0

# The unit tests that need no pack, run by `check` for whichever game is built.
junit_version=5.13.4
