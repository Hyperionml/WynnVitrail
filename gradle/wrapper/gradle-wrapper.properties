# WynnVitrail: bumped from 9.4.1 to 9.7.1.
# Gradle 9.4.1 hands the compile worker its classpath through an @argfile placed under
# GRADLE_USER_HOME (.tmp/gradle-worker-classpath*.txt). On a Windows profile whose path is
# not ASCII (here: C:/Users/<non-ascii>/.gradle) the worker JVM cannot resolve it, the
# classpath comes up empty and the worker dies with
#   ClassNotFoundException: worker.org.gradle.process.internal.worker.GradleWorkerMain
# 9.7.1 does not have this problem. Local fix only; upstream may prefer another route.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
